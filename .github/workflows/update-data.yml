name: Update Reading Data

on:
  schedule:
    - cron: '0 15 * * *'   # 매일 자정 KST (UTC 15:00)
  workflow_dispatch:         # 수동 트리거 버튼

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data from Google Sheets
        env:
          SHEETS_API_KEY:   ${{ secrets.SHEETS_API_KEY }}
          SPREADSHEET_ID:   ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/fetch_data.py

      - name: Commit & push data.json (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" || git commit -m "data: 독서 기록 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
