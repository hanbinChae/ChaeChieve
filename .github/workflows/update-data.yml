name: Build and Deploy Reading Dashboard

on:
  # 1. main 브랜치 코드 변경 시 자동 배포
  push:
    branches:
      - main

  # 2. 매일 자정 KST 정기 동기화 (UTC 15:00)
  schedule:
    - cron: '0 15 * * *'

  # 3. GitHub UI에서 수동 실행 버튼
  workflow_dispatch:

  # 4. Google Apps Script(시트 수정 시) 실시간 웹훅 트리거
  repository_dispatch:
    types: [sheet-updated]

# 동시 실행 방지
concurrency:
  group: pages
  cancel-in-progress: false

# GitHub Pages 배포를 위한 권한
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data from Google Sheets (generates data.json)
        env:
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/fetch_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
